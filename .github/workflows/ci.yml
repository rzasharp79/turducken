name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately installs without the `diffusion` extra: the app and its
      # whole test suite must work on a machine with no PyTorch and no GPU.
      # If that ever stops being true, CI is where we want to find out.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          turducken --version
          turducken doctor
          turducken init /tmp/recipe.json
          turducken check /tmp/recipe.json
