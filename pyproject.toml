[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turducken"
version = "0.1.0"
description = "User friendly, low overhead, custom LoRA training solution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# The real training engine. Heavy, GPU-oriented, deliberately not required to
# run the app: `turducken serve` works without these, it just cannot train.
diffusion = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.38",
    "peft>=0.10",
    "accelerate>=0.28",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
turducken = "turducken.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turducken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
